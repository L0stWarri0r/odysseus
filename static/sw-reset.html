<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odysseus — Reset local cache</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #11131a; color: #eef2ff; }
    main { width: min(560px, calc(100vw - 32px)); padding: 24px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(255,255,255,.06); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    h1 { margin: 0 0 10px; font-size: 1.15rem; }
    p { margin: 8px 0; opacity: .82; line-height: 1.45; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <h1>Resetting Odysseus local cache…</h1>
    <p id="status">Clearing Odysseus service worker registration and Odysseus Cache Storage.</p>
    <p>If this page does not redirect automatically, open <code>http://127.0.0.1:7000/</code> after a few seconds.</p>
  </main>
  <script type="module" src="/static/js/swReset.js"></script>
</body>
</html>
